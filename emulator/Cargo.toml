[package]
name = "rufflevita"
version = "1.2.0"
authors = ["İbrahim Doğan"]
edition = "2024"

[dependencies]
# Screenshots for RUFFLEVITA_SCRIPT (also on the Vita, for automated testing).
png = "0.18"
sdl2 = { version = "0.38.0", features = ["static-link", "use-pkgconfig"] }
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d", features = [
    "audio",
    "symphonia",
    "mp3",
    "aac",
    "nellymoser",
    "lzma",
    "default_compatibility_rules",
    "default_font",
] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d" }
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d", features = ["lzma"] }
ruffle_render_glow = { path = "ruffle_render_glow" }
glow = { git = "https://github.com/grovesNL/glow", branch = "main", features = [] }
anyhow = "1.0"
fontdue = "0.9"
flate2 = "1.1"
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tracing = { version = "0.1.43", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.7"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# Only needed to spell out NavigatorBackend's signatures; versions match ruffle_core's.
async-channel = "2.5"
encoding_rs = "0.8"
indexmap = "2.12"
# Explore's cover art (patched below for single-threaded decoding).
jpeg-decoder = { version = "0.3", default-features = false }

[features]
# Profiling: log the most executed AVM2 ops and op pairs with the perf line.
opstats = ["ruffle_core/rv_opstats"]
prof = ["ruffle_core/rv_outline"]
# Vita profiling build: rv_prof also covers AVM2 code (methods and ops).
prof_ops = ["ruffle_core/rv_prof_ops"]
# Development: count the Rust heap (see platform::heapcount).
heapcount = []

[target.armv7-sony-vita-newlibeabihf.dependencies]
vitasdk-sys = { version = "0.3.2", features = [
    "SceLibKernel_stub",
    "SceKernelThreadMgr_stub",
    "ScePower_stub",
    "SceRtc_stub",
] }

[patch.crates-io]
# Single-threaded JPEG decoding on Vita; see patches/jpeg-decoder/src/decoder.rs.
jpeg-decoder = { path = "patches/jpeg-decoder" }

[patch."https://github.com/ruffle-rs/ruffle"]
# Ruffle's core with performance fixes; see patches/ruffle/README.md.
ruffle_core = { path = "patches/ruffle/core" }
ruffle_common = { path = "patches/ruffle/core/common" }

# Desktop builds can dump screenshots (RUFFLEVITA_SCRIPT), used for development.
[target.'cfg(not(target_os = "vita"))'.dependencies]

[package.metadata.vita]
title_id = "RUFFLEVIT"
title_name = "RuffleVita"
assets = "./static/vita"
build_std = "std,panic_unwind"

[package.metadata.vita.profile.vita]
strip_symbols = true

[profile.dev]
# Ruffle is unusably slow unoptimised; keep our own crate debuggable.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.vita]
inherits = "release"
